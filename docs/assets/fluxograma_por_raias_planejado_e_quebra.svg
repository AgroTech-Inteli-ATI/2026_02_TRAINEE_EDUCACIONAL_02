<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="720" viewBox="0 0 1360 720" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
<rect width="1360" height="720" fill="#fcfcfb"/>
<defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#898781"/></marker>
<marker id="setaL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#eb6834"/></marker></defs>
<text x="20" y="38" font-size="18" fill="#0b0b0b" font-weight="600" text-anchor="start">Fluxograma por raias: caminho planejado e caminho de quebra</text><text x="20" y="66" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Quem executa cada etapa e onde o fluxo se divide. Áreas genéricas; etapas 3 e 4 conforme a PLT.02 da Raízen</text><rect x="10" y="90" width="120" height="100" fill="#f0efec"/><text x="70" y="145" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="middle">Operação</text><line x1="10" x2="1350" y1="90" y2="90" stroke="#e1e0d9"/><rect x="10" y="190" width="120" height="110" fill="#f0efec"/><text x="70" y="250" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="middle">Manutenção</text><line x1="10" x2="1350" y1="190" y2="190" stroke="#e1e0d9"/><rect x="10" y="300" width="120" height="120" fill="#f0efec"/><text x="70" y="365" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="middle">Suprimentos</text><line x1="10" x2="1350" y1="300" y2="300" stroke="#e1e0d9"/><rect x="10" y="420" width="120" height="110" fill="#f0efec"/><text x="70" y="471.4" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="middle">Fornecedor e</text><text x="70" y="488.4" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="middle">transporte</text><line x1="10" x2="1350" y1="420" y2="420" stroke="#e1e0d9"/><rect x="10" y="530" width="120" height="130" fill="#f0efec"/><text x="70" y="600" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="middle">Almoxarifado</text><line x1="10" x2="1350" y1="530" y2="530" stroke="#e1e0d9"/><line x1="10" x2="1350" y1="660" y2="660" stroke="#e1e0d9"/><path d="M380 166L380 218" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#setaL)"/><path d="M280 245L299 245" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#seta)"/><path d="M380 271L380 595L484 595" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#seta)"/><path d="M560 560L560 272" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#seta)"/><text x="568" y="547" font-size="13" fill="#52514e" font-weight="600" text-anchor="start">Não</text><path d="M640 245L740 245L740 324" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#seta)"/><path d="M815 360L849 360" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#seta)"/><text x="820" y="352" font-size="13" fill="#52514e" font-weight="600" text-anchor="start">Não</text><path d="M1010 360L1080 360L1080 448" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#seta)"/><path d="M740 395L740 475L999 475" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#setaL)"/><text x="752" y="422" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">Sim: compra imediata</text><text x="752" y="439" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">ou emergencial</text><path d="M1080 501L1080 568" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#seta)"/><path d="M1160 595L1174 595" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#seta)"/><path d="M560 630L560 645L1255 645L1255 622" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#seta)"/><text x="572" y="640" font-size="13" fill="#52514e" font-weight="600" text-anchor="start">Sim</text><path d="M1255 569L1255 272" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#seta)"/><rect x="300" y="114" width="160" height="52" rx="26" fill="#fcfcfb" stroke="#eb6834" stroke-width="2.5"/><text x="380" y="136.55" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="middle">Falha de equipamento</text><text x="380" y="152.55" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="middle">na safra</text><rect x="140" y="219" width="140" height="52" rx="26" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2.5"/><text x="210" y="241.55" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="middle">Plano de manutenção</text><text x="210" y="257.55" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="middle">de entressafra</text><rect x="300" y="219" width="160" height="52" rx="6" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/><text x="380" y="241.55" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="middle">1. Abrir ordem de serviço</text><text x="380" y="257.55" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="middle">com lista de materiais</text><path d="M560 560L635 595L560 630L485 595Z" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/><text x="560" y="591.55" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="middle">2. Item em</text><text x="560" y="607.55" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="middle">estoque?</text><rect x="480" y="219" width="160" height="52" rx="6" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/><text x="560" y="241.55" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="middle">3. Emitir requisição no</text><text x="560" y="257.55" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="middle">SAP (prioridade e data)</text><path d="M740 325L815 360L740 395L665 360Z" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/><text x="740" y="356.55" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="middle">Risco iminente</text><text x="740" y="372.55" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="middle">de parada?</text><rect x="850" y="334" width="160" height="52" rx="6" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/><text x="930" y="356.55" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="middle">4. Cotar, aprovar alçadas</text><text x="930" y="372.55" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="middle">e emitir pedido</text><rect x="1000" y="449" width="160" height="52" rx="6" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/><text x="1080" y="471.55" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="middle">5. Fabricar ou separar</text><text x="1080" y="487.55" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="middle">e transportar</text><rect x="1000" y="569" width="160" height="52" rx="6" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/><text x="1080" y="591.55" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="middle">6. Receber</text><text x="1080" y="607.55" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="middle">e inspecionar</text><rect x="1175" y="569" width="160" height="52" rx="6" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/><text x="1255" y="591.55" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="middle">7. Separar e entregar</text><text x="1255" y="607.55" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="middle">à manutenção</text><rect x="1175" y="219" width="160" height="52" rx="26" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="2"/><text x="1255" y="241.55" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="middle">Aplicar o material e</text><text x="1255" y="257.55" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="middle">registrar o consumo</text><rect x="20" y="683" width="34" height="18" rx="9" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2.5"/><text x="62" y="697" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Início planejado (entressafra)</text><rect x="270" y="683" width="34" height="18" rx="9" fill="#fcfcfb" stroke="#eb6834" stroke-width="2.5"/><text x="312" y="697" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Início por quebra (safra)</text><line x1="490" x2="524" y1="692" y2="692" stroke="#eb6834" stroke-width="2" marker-end="url(#setaL)"/><text x="532" y="697" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Caminho com risco iminente de parada</text><path d="M807 682L824 692L807 702L790 692Z" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/><text x="832" y="697" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Decisão</text><text x="900" y="697" font-size="13" fill="#898781" font-weight="400" text-anchor="start" font-style="italic">Na compra emergencial, o próprio usuário compra e regulariza depois.</text></svg>