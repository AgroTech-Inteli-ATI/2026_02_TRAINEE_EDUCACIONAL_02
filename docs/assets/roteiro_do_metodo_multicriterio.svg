<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
<rect width="1100" height="340" fill="#fcfcfb"/><text x="20" y="38" font-size="18" fill="#0b0b0b" font-weight="600" text-anchor="start">Roteiro do método: do cenário à decisão</text><text x="20" y="66" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Os cinco passos aplicados nesta página e o que cada um produz</text><path d="M15 96H204.6L222.6 176L204.6 256H15Z" fill="#f0efec"/><circle cx="47" cy="130" r="14" fill="#2a78d6"/><text x="47" y="135" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="71" y="135" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">Premissas</text><text x="33" y="172" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Rede, distâncias, tempo</text><text x="33" y="191" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">tolerável e correlações</text><text x="33" y="238" font-size="12" fill="#898781" font-weight="600" text-anchor="start">Tabela 1</text><path d="M230.6 96H420.2L438.2 176L420.2 256H230.6L248.6 176Z" fill="#e8f0fb"/><circle cx="276.6" cy="130" r="14" fill="#2a78d6"/><text x="276.6" y="135" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="300.6" y="135" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">Filtro eliminatório</text><text x="262.6" y="172" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Atende ao item crítico</text><text x="262.6" y="191" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">em até 8 h?</text><text x="262.6" y="238" font-size="12" fill="#898781" font-weight="600" text-anchor="start">Tabela 5</text><path d="M446.2 96H635.8L653.8 176L635.8 256H446.2L464.2 176Z" fill="#f0efec"/><circle cx="492.2" cy="130" r="14" fill="#2a78d6"/><text x="492.2" y="135" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="516.2" y="135" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">Pesos pelo AHP</text><text x="478.2" y="172" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Comparação par a par;</text><text x="478.2" y="191" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">CR = 0,009</text><text x="478.2" y="238" font-size="12" fill="#898781" font-weight="600" text-anchor="start">Tabelas 3 e 4</text><path d="M661.8 96H851.4L869.4 176L851.4 256H661.8L679.8 176Z" fill="#f0efec"/><circle cx="707.8" cy="130" r="14" fill="#2a78d6"/><text x="707.8" y="135" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="731.8" y="135" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">Notas ancoradas</text><text x="693.8" y="172" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Notas de 1 a 5 com</text><text x="693.8" y="191" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">significado fixo</text><text x="693.8" y="238" font-size="12" fill="#898781" font-weight="600" text-anchor="start">Tabelas 2 e 6</text><path d="M877.4 96H1085V256H877.4L895.4 176Z" fill="#f0efec"/><circle cx="923.4" cy="130" r="14" fill="#2a78d6"/><text x="923.4" y="135" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="947.4" y="135" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">Resultado</text><text x="909.4" y="172" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Soma ponderada;</text><text x="909.4" y="191" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">sensibilidade a ±10 p.p.</text><text x="909.4" y="210" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">e cenário contrastante</text><text x="909.4" y="238" font-size="12" fill="#898781" font-weight="600" text-anchor="start">Tabelas 6, 7 e 8</text><text x="262.6" y="290" font-size="13" fill="#d03b3b" font-weight="600" text-anchor="start">No cenário base, o centralizado é eliminado aqui (14 h > 8 h).</text><text x="15" y="318" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Os passos 3 a 5 podem ser refeitos no simulador e na planilha desta página.</text></svg>