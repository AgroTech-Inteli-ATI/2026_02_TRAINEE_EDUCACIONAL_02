<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
<rect width="1100" height="610" fill="#fcfcfb"/>
<defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#898781"/></marker>
<marker id="setaL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#eb6834"/></marker></defs>
<text x="20" y="38" font-size="18" fill="#0b0b0b" font-weight="600" text-anchor="start">SIPOC do fluxo de um item MRO industrial, da necessidade à aplicação</text><text x="20" y="66" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Visão de alto nível: quem fornece, o que entra, as sete etapas, o que sai e quem recebe</text><path d="M15 92H181L195 125L181 158H15Z" fill="#f0efec"/><text x="33" y="136" font-size="30" fill="#2a78d6" font-weight="700" text-anchor="start">S</text><text x="65" y="121" font-size="13" fill="#898781" font-weight="400" text-anchor="start">Suppliers</text><text x="65" y="140" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">Fornecedores</text><path d="M205 92H416L430 125L416 158H205L219 125Z" fill="#f0efec"/><text x="233" y="136" font-size="30" fill="#2a78d6" font-weight="700" text-anchor="start">I</text><text x="265" y="121" font-size="13" fill="#898781" font-weight="400" text-anchor="start">Inputs</text><text x="265" y="140" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">Entradas</text><path d="M440 92H666L680 125L666 158H440L454 125Z" fill="#2a78d6"/><text x="468" y="136" font-size="30" fill="#ffffff" font-weight="700" text-anchor="start">P</text><text x="500" y="121" font-size="13" fill="#ffffff" font-weight="400" text-anchor="start">Process</text><text x="500" y="140" font-size="15" fill="#ffffff" font-weight="600" text-anchor="start">Processo</text><path d="M690 92H901L915 125L901 158H690L704 125Z" fill="#f0efec"/><text x="718" y="136" font-size="30" fill="#2a78d6" font-weight="700" text-anchor="start">O</text><text x="750" y="121" font-size="13" fill="#898781" font-weight="400" text-anchor="start">Outputs</text><text x="750" y="140" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">Saídas</text><path d="M925 92H1071L1085 125L1071 158H925L939 125Z" fill="#f0efec"/><text x="953" y="136" font-size="30" fill="#2a78d6" font-weight="700" text-anchor="start">C</text><text x="985" y="121" font-size="13" fill="#898781" font-weight="400" text-anchor="start">Customers</text><text x="985" y="140" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">Clientes</text><text x="25" y="202.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Operação; engenharia</text><text x="25" y="219.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">de manutenção</text><text x="215" y="202.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Aviso de falha ou</text><text x="215" y="219.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">plano de entressafra</text><rect x="446" y="184" width="228" height="44" rx="6" fill="#e8f0fb"/><text x="460" y="202.05" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">1. Identificar</text><text x="460" y="219.05" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">a necessidade</text><line x1="560" x2="560" y1="229" y2="242" stroke="#2a78d6" stroke-width="1.5" marker-end="url(#seta)"/><text x="700" y="202.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Ordem de serviço com</text><text x="700" y="219.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">lista de materiais</text><text x="935" y="202.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Planejamento</text><text x="935" y="219.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">da manutenção</text><line x1="19" x2="191" y1="236" y2="236" stroke="#e1e0d9"/><line x1="209" x2="426" y1="236" y2="236" stroke="#e1e0d9"/><line x1="694" x2="911" y1="236" y2="236" stroke="#e1e0d9"/><line x1="929" x2="1081" y1="236" y2="236" stroke="#e1e0d9"/><text x="25" y="270.55" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Almoxarifado; ERP</text><text x="215" y="262.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Ordem de serviço;</text><text x="215" y="279.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">saldo em estoque</text><rect x="446" y="244" width="228" height="44" rx="6" fill="#e8f0fb"/><text x="460" y="262.05" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">2. Verificar o estoque</text><text x="460" y="279.05" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">e reservar</text><line x1="560" x2="560" y1="289" y2="302" stroke="#2a78d6" stroke-width="1.5" marker-end="url(#seta)"/><text x="700" y="262.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Item reservado ou</text><text x="700" y="279.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">necessidade de compra</text><text x="935" y="262.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Manutenção;</text><text x="935" y="279.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Suprimentos</text><line x1="19" x2="191" y1="296" y2="296" stroke="#e1e0d9"/><line x1="209" x2="426" y1="296" y2="296" stroke="#e1e0d9"/><line x1="694" x2="911" y1="296" y2="296" stroke="#e1e0d9"/><line x1="929" x2="1081" y1="296" y2="296" stroke="#e1e0d9"/><text x="25" y="322.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Manutenção</text><text x="25" y="339.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">(requisitante)</text><text x="215" y="322.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Especificação, prioridade</text><text x="215" y="339.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">e data de necessidade</text><rect x="446" y="304" width="228" height="44" rx="6" fill="#e8f0fb"/><text x="460" y="322.05" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">3. Emitir a requisição</text><text x="460" y="339.05" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">no SAP</text><line x1="560" x2="560" y1="349" y2="362" stroke="#2a78d6" stroke-width="1.5" marker-end="url(#seta)"/><text x="700" y="330.55" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Requisição aprovada</text><text x="935" y="330.55" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Suprimentos</text><line x1="19" x2="191" y1="356" y2="356" stroke="#e1e0d9"/><line x1="209" x2="426" y1="356" y2="356" stroke="#e1e0d9"/><line x1="694" x2="911" y1="356" y2="356" stroke="#e1e0d9"/><line x1="929" x2="1081" y1="356" y2="356" stroke="#e1e0d9"/><text x="25" y="382.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Fornecedores homologados;</text><text x="25" y="399.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">acordos comerciais</text><text x="215" y="382.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Requisição; propostas;</text><text x="215" y="399.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">alçadas de aprovação</text><rect x="446" y="364" width="228" height="44" rx="6" fill="#e8f0fb"/><text x="460" y="382.05" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">4. Cotar, negociar</text><text x="460" y="399.05" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">e aprovar</text><line x1="560" x2="560" y1="409" y2="422" stroke="#2a78d6" stroke-width="1.5" marker-end="url(#seta)"/><text x="700" y="390.55" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Pedido de compra</text><text x="935" y="382.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Fornecedor;</text><text x="935" y="399.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Manutenção</text><line x1="19" x2="191" y1="416" y2="416" stroke="#e1e0d9"/><line x1="209" x2="426" y1="416" y2="416" stroke="#e1e0d9"/><line x1="694" x2="911" y1="416" y2="416" stroke="#e1e0d9"/><line x1="929" x2="1081" y1="416" y2="416" stroke="#e1e0d9"/><text x="25" y="442.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Fornecedor;</text><text x="25" y="459.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">transportadora</text><text x="215" y="442.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Pedido de compra;</text><text x="215" y="459.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">prazo de entrega</text><rect x="446" y="424" width="228" height="44" rx="6" fill="#e8f0fb"/><text x="460" y="442.05" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">5. Fabricar ou separar</text><text x="460" y="459.05" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">e transportar</text><line x1="560" x2="560" y1="469" y2="482" stroke="#2a78d6" stroke-width="1.5" marker-end="url(#seta)"/><text x="700" y="442.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Material expedido</text><text x="700" y="459.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">com nota fiscal</text><text x="935" y="450.55" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Almoxarifado</text><line x1="19" x2="191" y1="476" y2="476" stroke="#e1e0d9"/><line x1="209" x2="426" y1="476" y2="476" stroke="#e1e0d9"/><line x1="694" x2="911" y1="476" y2="476" stroke="#e1e0d9"/><line x1="929" x2="1081" y1="476" y2="476" stroke="#e1e0d9"/><text x="25" y="510.55" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Transportadora</text><text x="215" y="502.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Nota fiscal; pedido;</text><text x="215" y="519.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">especificação</text><rect x="446" y="484" width="228" height="44" rx="6" fill="#e8f0fb"/><text x="460" y="502.05" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">6. Receber</text><text x="460" y="519.05" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">e inspecionar</text><line x1="560" x2="560" y1="529" y2="542" stroke="#2a78d6" stroke-width="1.5" marker-end="url(#seta)"/><text x="700" y="502.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Material conferido ou</text><text x="700" y="519.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">não conformidade</text><text x="935" y="502.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Almoxarifado;</text><text x="935" y="519.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Manutenção</text><line x1="19" x2="191" y1="536" y2="536" stroke="#e1e0d9"/><line x1="209" x2="426" y1="536" y2="536" stroke="#e1e0d9"/><line x1="694" x2="911" y1="536" y2="536" stroke="#e1e0d9"/><line x1="929" x2="1081" y1="536" y2="536" stroke="#e1e0d9"/><text x="25" y="570.55" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Almoxarifado</text><text x="215" y="562.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Reserva; ordem</text><text x="215" y="579.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">de serviço</text><rect x="446" y="544" width="228" height="44" rx="6" fill="#e8f0fb"/><text x="460" y="562.05" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">7. Entregar e registrar</text><text x="460" y="579.05" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">o consumo</text><text x="700" y="562.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Material aplicado e</text><text x="700" y="579.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">consumo baixado</text><text x="935" y="562.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Manutenção;</text><text x="935" y="579.05" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Suprimentos</text></svg>