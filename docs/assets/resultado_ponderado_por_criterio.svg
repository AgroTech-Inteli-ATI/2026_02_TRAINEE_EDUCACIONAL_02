<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
<rect width="1100" height="430" fill="#fcfcfb"/><text x="20" y="38" font-size="18" fill="#0b0b0b" font-weight="600" text-anchor="start">O híbrido obtém o melhor resultado ao combinar disponibilidade e capital</text><text x="20" y="66" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Resultado ponderado no cenário base (0 a 5), decomposto pela contribuição de cada critério (peso × nota)</text><rect x="20" y="92" width="14" height="14" rx="3" fill="#2a78d6"/><text x="41" y="104" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">C1. Disponibilidade</text><rect x="200" y="92" width="14" height="14" rx="3" fill="#eb6834"/><text x="221" y="104" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">C2. Capital</text><rect x="324" y="92" width="14" height="14" rx="3" fill="#1baf7a"/><text x="345" y="104" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">C3. Transporte</text><rect x="469" y="92" width="14" height="14" rx="3" fill="#eda100"/><text x="490" y="104" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">C4. Governança</text><rect x="614" y="92" width="14" height="14" rx="3" fill="#e87ba4"/><text x="635" y="104" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">C5. Escala</text><rect x="731" y="92" width="14" height="14" rx="3" fill="#008300"/><text x="752" y="104" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">C6. Resiliência</text><line x1="190" x2="190" y1="134" y2="344" stroke="#c3c2b7"/><text x="190" y="366" font-size="13" fill="#898781" font-weight="400" text-anchor="middle">0</text><line x1="352" x2="352" y1="134" y2="344" stroke="#e1e0d9"/><text x="352" y="366" font-size="13" fill="#898781" font-weight="400" text-anchor="middle">1</text><line x1="514" x2="514" y1="134" y2="344" stroke="#e1e0d9"/><text x="514" y="366" font-size="13" fill="#898781" font-weight="400" text-anchor="middle">2</text><line x1="676" x2="676" y1="134" y2="344" st